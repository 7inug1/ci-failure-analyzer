name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, local]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 실행 위치 확인
        shell: bash
        run: |
          printf 'runner_environment=%s\n' "$RUNNER_ENVIRONMENT"
          printf 'runner_name=%s\n' "$RUNNER_NAME"
          printf 'workspace=%s\n' "$GITHUB_WORKSPACE"
          printf 'current_directory='
          pwd
      - run: npm ci
      - run: npm test
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
