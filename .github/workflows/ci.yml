# CI: PR이 올라오거나 main에 코드가 합쳐질 때 린트와 테스트를 돌린다.
# 이 파일의 name이 "CI"여야 6번 단계의 분석 워크플로가 이름으로 찾을 수 있다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
