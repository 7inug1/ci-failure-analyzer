# CI: PR이 올라오거나 main에 코드가 합쳐질 때 린트와 테스트를 돌린다.
# 이 파일의 name이 "CI"여야 6번 단계의 분석 워크플로가 이름으로 찾을 수 있다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 린트와 테스트 (Node 20)
    runs-on: [self-hosted, local]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 실행 위치 확인 (내 맥인지 보기)
        run: pwd && hostname
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: 분석 서버 설치와 타입 검사
        working-directory: analyzer
        run: npm ci && npm run typecheck
      - name: 분석 서버 테스트
        working-directory: analyzer
        run: npm test
      - name: 테스트 리포트 올리기 (실패해도 실행)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
      - name: 관찰용 대기 40초 (임시, 단계별 확인이 끝나면 제거)
        run: sleep 40
