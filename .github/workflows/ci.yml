# CI 단계별 재구성: 한 PR에 한 단계씩 쌓으며 Actions 화면 변화를 확인한다.
# 이 파일의 name이 "CI"여야 6번 단계의 분석 워크플로가 이름으로 찾을 수 있다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 관찰용 대기 20초 (임시, 단계별 확인이 끝나면 제거)
        run: sleep 20
