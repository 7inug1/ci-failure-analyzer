# CI 실패 분석 (6번 단계의 첫 걸음): CI가 실패나 시간 초과로 끝났을 때만 깨어난다.
# 지금은 깨어났다는 것과 어떤 실행인지만 출력한다. 로그 분석과 AI 호출은 뒤 단계에서 더한다.
# workflow_run 워크플로는 기본 브랜치(main)에 있어야 동작한다.
name: CI 실패 분석

on:
  workflow_run:
    workflows: ['CI'] # ci.yml의 name과 글자가 같아야 한다
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: 실패 감지
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: [self-hosted, local]
    timeout-minutes: 5
    steps:
      - name: 실패한 CI 정보 출력
        # 브랜치 이름처럼 바깥에서 오는 값은 명령에 직접 넣지 않고 환경 변수로 받는다
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "CI 실패 감지"
          echo "실행 번호: $RUN_ID"
          echo "브랜치: $BRANCH"
          echo "커밋: $SHA"
          echo "결과: $RESULT"
          pwd && hostname
      - name: 실패한 CI의 로그와 리포트 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"  # 내 맥 러너에서 gh를 찾기 위해
          mkdir -p "$RUNNER_TEMP/analysis" && cd "$RUNNER_TEMP/analysis"
          gh run view "$RUN_ID" --log-failed > log.txt
          echo "log.txt: $(wc -l < log.txt | tr -d ' ')줄, $(wc -c < log.txt | tr -d ' ')자"
          # 리포트가 없는 실패(빌드 실패 등)도 있으므로 없어도 계속 진행한다
          if gh run download "$RUN_ID" -n test-report -D .; then
            echo "report.xml: $(grep -oE 'tests="[0-9]+" failures="[0-9]+"' report.xml | head -1)"
          else
            echo "report.xml 없음 (리포트 없이 분석)"
          fi
          ls -l
      - name: 분석 서버에 보내 답 받기
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cd "$RUNNER_TEMP/analysis"
          args=(-F "log=@log.txt" -F "sha=$SHA" -F "branch=$BRANCH" -F "event=$EVENT" -F "run_url=$RUN_URL")
          [ -f report.xml ] && args+=(-F "report=@report.xml")
          # 서버가 꺼져 있거나 오류가 나도 실패 소식은 남긴다 (AI가 한 말을 지어내지 않음)
          if curl -sS -f --max-time 120 -X POST http://127.0.0.1:8000/analyze "${args[@]}" -o comment.md; then
            echo "분석 서버 응답 받음: $(wc -c < comment.md | tr -d ' ')자"
          else
            printf '### CI 실패 분석\n\n자동 분석을 하지 못했습니다 (분석 서버에 연결하지 못함).\n\n[실행 기록](%s)\n' "$RUN_URL" > comment.md
            echo "분석 서버 연결 실패, 대신 알림 댓글을 준비함"
          fi
          cat comment.md
      - name: PR에 댓글 달기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/analysis/comment.md"
            echo "PR #$PR_NUMBER 에 댓글을 달았습니다"
          else
            echo "연결된 PR이 없음 (main의 실패는 이슈로 남기는 단계에서 처리)"
          fi
